[package]
name = "caissepro-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "caissepro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
caissepro-local-store = { path = "../../../packages/local-store" }
caissepro-session = { path = "../../../packages/session-core" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
