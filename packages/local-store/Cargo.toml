[package]
name = "caissepro-local-store"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
rusqlite = { version = "=0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8.5"
zeroize = "1.8.2"
hex = "0.4.3"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

[features]
# Only used by native library tests; never enabled by the desktop build.
test-support = []
