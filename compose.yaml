services:
  postgres:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    command:
      [
        'postgres',
        '-c',
        'log_error_verbosity=terse',
        '-c',
        'log_min_error_statement=panic',
        '-c',
        'log_statement=none',
        '-c',
        'log_parameter_max_length_on_error=0',
      ]
    environment:
      POSTGRES_USER: caissepro
      POSTGRES_DB: caissepro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['caissepro-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caissepro -d caissepro']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  caissepro-postgres:
