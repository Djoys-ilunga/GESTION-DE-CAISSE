name: Qualification du stockage local
on:
  workflow_dispatch:
  push:
    branches: [main, feat/etape-13b-brouillons-chiffres]
    paths:
      [
        'apps/desktop/**',
        'packages/shared/**',
        'packages/local-store/**',
        'packages/session-core/**',
        'pnpm-lock.yaml',
        'rust-toolchain.toml',
        'scripts/native-qualification-command.mjs',
        '.github/workflows/local-store-native.yml',
      ]
  pull_request:
    paths:
      [
        'apps/desktop/**',
        'packages/shared/**',
        'packages/local-store/**',
        'packages/session-core/**',
        'pnpm-lock.yaml',
        'rust-toolchain.toml',
        'scripts/native-qualification-command.mjs',
        '.github/workflows/local-store-native.yml',
      ]
permissions:
  contents: read
jobs:
  native:
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-qualification
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      # Cases that exercise concurrency still spawn their own workers; isolate
      # the suites to avoid competing KDFs/keychain calls starving HTTP fixtures.
      RUST_TEST_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/local-store
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/native-qualification
          key: ${{ runner.os }}-${{ runner.arch }}-rust190-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-native-v1
      - name: Trousseau temporaire de qualification macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          qualification_keychain="$RUNNER_TEMP/CaisseProQualification.keychain-db"
          qualification_password="$(openssl rand -hex 32)"
          echo "::add-mask::$qualification_password"
          previous_keychain="$(security default-keychain -d user 2>/dev/null || true)"
          previous_keychain="${previous_keychain#*\"}"
          previous_keychain="${previous_keychain%\"*}"
          printf 'CAISSEPRO_PREVIOUS_KEYCHAIN=%s\n' "$previous_keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$qualification_password" "$qualification_keychain"
          security set-keychain-settings -lut 3600 "$qualification_keychain"
          security unlock-keychain -p "$qualification_password" "$qualification_keychain"
          security default-keychain -d user -s "$qualification_keychain"
      - name: Outils OpenSSL Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }
          'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $global:LASTEXITCODE = 0
      - name: Rust verrouillé
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: node ../../scripts/native-qualification-command.mjs cargo clippy --locked --all-targets -- -D warnings
      - name: SQLCipher et magasin de clés natif
        run: node ../../scripts/native-qualification-command.mjs cargo test --locked
      - name: Sessions natives et isolation hors connexion
        working-directory: packages/session-core
        run: node ../../scripts/native-qualification-command.mjs cargo test --locked
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - name: pnpm verrouillé
        working-directory: .
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Dépendances JavaScript verrouillées
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Générer le client Prisma sans connexion à une base
        working-directory: .
        env:
          DATABASE_URL: postgresql://unused@127.0.0.1:5432/caissepro
        run: pnpm db:generate
      - name: Types, lint, tests unitaires et builds JavaScript
        working-directory: .
        run: node scripts/native-qualification-command.mjs pnpm check
      - name: Compiler et lier le véritable desktop avec ses fichiers embarqués
        working-directory: .
        run: node scripts/native-qualification-command.mjs pnpm --filter @caissepro/desktop exec tauri build --debug --no-bundle
      - name: Retirer le trousseau de qualification macOS
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${CAISSEPRO_PREVIOUS_KEYCHAIN:-}" ]]; then
            security default-keychain -d user -s "$CAISSEPRO_PREVIOUS_KEYCHAIN"
          fi
          security delete-keychain "$RUNNER_TEMP/CaisseProQualification.keychain-db"
